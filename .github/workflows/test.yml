name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -I -m unittest discover -s sync -p 'test_*.py' -v
