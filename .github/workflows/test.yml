name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -I -m unittest discover -s sync -p 'test_*.py' -v
