# Regenerates each network branch from the network's on-chain package registry,
# commits the branch when the tree has changed, and tags each registry state.
name: sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: sync (${{ matrix.network }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        network: [mainnet, testnet, devnet]
    concurrency:
      group: sync-${{ matrix.network }}
      cancel-in-progress: false
    env:
      NETWORK: ${{ matrix.network }}
      REPO_URL: https://github.com/${{ github.repository }}.git
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check out the generator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tool
          persist-credentials: false

      - name: Check out the network branch
        run: |
          set -euo pipefail
          git init -q tree
          git -C tree remote add origin "$REPO_URL"
          # ls-remote --exit-code returns 2 when nothing matches; anything else non-zero is an error.
          rc=0; git -C tree ls-remote --exit-code --heads origin "$NETWORK" >/dev/null || rc=$?
          case "$rc" in
            0)
              git -C tree fetch -q --depth=1 origin "refs/heads/$NETWORK:refs/remotes/origin/$NETWORK"
              git -C tree checkout -q -b "$NETWORK" "origin/$NETWORK"
              ;;
            2)
              echo "Branch $NETWORK does not exist yet; starting it."
              git -C tree checkout -q --orphan "$NETWORK"
              ;;
            *) echo "::error::Looking up branch $NETWORK failed with exit code $rc."; exit 1 ;;
          esac

      - name: Generate the tree
        id: generate
        run: |
          set -euo pipefail
          # The generator reads the branch head's registry.json before replacing the tree.
          if [ -f tree/registry.json ]; then cp tree/registry.json previous.json; fi
          rc=0
          tag=$(python3 -I tool/sync/generate.py --network "$NETWORK" --out tree \
            --previous previous.json --message-file message.txt) || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::warning::The $NETWORK registry changed between two reads; skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git -C tree add -A
          if git -C tree rev-parse -q --verify HEAD >/dev/null && git -C tree diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The $NETWORK tree is unchanged ($tag)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -C tree diff --cached --stat | tail -n 1
          fi

      - name: Compile and test a dependent package
        if: steps.generate.outputs.skip == 'false' && steps.generate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          image="supraoracles/supra-${NETWORK}-validator-node:latest"
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *) echo "::error::Unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          if ! docker manifest inspect -v "$image" > manifest.json 2> manifest.err; then
            if grep -q '^no such manifest:' manifest.err; then
              echo "::notice::$image does not exist; skipping the compile check for $NETWORK."
              exit 0
            fi
            echo "::error::Inspecting $image failed: $(head -c 500 manifest.err)"
            exit 1
          fi
          if ! python3 -I -c '
          import json, sys
          data = json.load(open("manifest.json"))
          items = data if isinstance(data, list) else [data]
          platforms = [i.get("Descriptor", {}).get("platform") or {} for i in items]
          sys.exit(0 if any(p.get("os") == "linux" and p.get("architecture") == sys.argv[1] for p in platforms) else 1)
          ' "$arch"; then
            echo "::notice::$image has no linux/$arch image; skipping the compile check for $NETWORK."
            exit 0
          fi
          cp -R tool/sync/sample sample
          docker run --rm --network none --platform "linux/$arch" \
            -v "$PWD/tree:/work/tree:ro" -v "$PWD/sample:/work/sample" -e HOME=/tmp \
            --entrypoint /supra/supra "$image" \
            move tool test --package-dir /work/sample --skip-fetch-latest-git-deps

      - name: Commit and tag
        id: commit
        if: steps.generate.outputs.skip == 'false'
        env:
          TAG: ${{ steps.generate.outputs.tag }}
          CHANGED: ${{ steps.generate.outputs.changed }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" = "true" ]; then
            git -C tree commit -q -F ../message.txt
          fi
          # A tag names a registry state. A later commit generated from the same
          # registry can differ in the generated files, and leaves the tag in place.
          rc=0; git -C tree ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || rc=$?
          case "$rc" in
            0)
              git -C tree fetch -q --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
              tagged=$(git -C tree show "$TAG:registry.json" | python3 -I -c 'import json, sys; print(json.load(sys.stdin)["registry_sha256"])')
              current=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["registry_sha256"])' tree/registry.json)
              if [ "$tagged" != "$current" ]; then
                echo "::error::Tag $TAG names registry $tagged, but this tree was generated from registry $current."
                exit 1
              fi
              echo "push_tag=false" >> "$GITHUB_OUTPUT"
              ;;
            2)
              git -C tree tag -a "$TAG" -F ../message.txt
              echo "push_tag=true" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::Looking up tag $TAG failed with exit code $rc."; exit 1 ;;
          esac

      - name: Push
        if: steps.generate.outputs.skip == 'false'
        env:
          TAG: ${{ steps.generate.outputs.tag }}
          CHANGED: ${{ steps.generate.outputs.changed }}
          PUSH_TAG: ${{ steps.commit.outputs.push_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refs=()
          if [ "$CHANGED" = "true" ]; then refs+=("HEAD:refs/heads/$NETWORK"); fi
          if [ "$PUSH_TAG" = "true" ]; then refs+=("refs/tags/$TAG"); fi
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "Nothing to push for $NETWORK."
            exit 0
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C tree -c http.extraheader="$auth" push -q --atomic origin "${refs[@]}"
